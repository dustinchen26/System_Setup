        flex-wrap: wrap;

    h2 { margin: 0; font-size: 16px; color: #0076ce; }
    .badge-hint { font-size: 11px; color: #6c757d; }

        padding: 10px 15px;
        text-align: center;
        background-color: #f8fbff;
        cursor: pointer;
        transition: background-color 0.15s;
        margin-bottom: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        flex-wrap: wrap;
    }
    .upload-area:hover, .upload-area.dragover { background-color: #e6f2ff; }
    .upload-area input[type="file"] { display: none; }
    .upload-btn {
        background-color: #0076ce;
        color: white;
        padding: 4px 12px;
        border-radius: 3px;
        font-size: 12px;
        font-weight: 500;
    }

    .paste-panel {
        border: 1px solid #ced4da;
        border-radius: 4px;
        padding: 8px 10px;
        background: #fcfcfd;
        margin-bottom: 10px;
    }
    .paste-panel .paste-head {

        justify-content: space-between;
        align-items: center;
        margin-bottom: 6px;
        flex-wrap: wrap;
        gap: 6px;
    }
    .paste-panel label { font-size: 12px; font-weight: 600; color: #495057; }

        width: 100%;
        min-height: 110px;
        resize: vertical;
        border: 1px solid #ced4da;
        border-radius: 3px;
        padding: 6px 8px;
        font-family: Consolas, "Courier New", monospace;
        font-size: 12px;
        line-height: 1.35;
        color: #212529;
        background: #fff;
    }
    #pasteInput:focus { outline: 2px solid #a8d1f5; border-color: #0076ce; }

    .info-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
        background-color: #e9ecef;
        padding: 6px 12px;
        border-radius: 4px;
        margin-bottom: 8px;
        font-size: 12px;
    }
    .file-meta { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .file-name-display { font-weight: bold; color: #212529; }
    .file-name-display span { color: #0076ce; }
    .format-tag {
        background: #0076ce; color: #fff; padding: 1px 6px; border-radius: 3px; font-size: 11px;
    }
    .toolbar-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .action-btn {
        padding: 4px 10px;
        border: 1px solid transparent;
        border-radius: 3px;
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 4px;
        transition: background-color 0.15s, border-color 0.15s;
    }
    .btn-md { background-color: #ffffff; color: #212529; border-color: #ced4da; }
    .btn-md:hover { background-color: #f8f9fa; border-color: #adb5bd; }
    .btn-md.copied { background-color: #198754; color: #ffffff; border-color: #198754; }
    .btn-excel { background-color: #198754; color: #ffffff; }
    .btn-excel:hover { background-color: #157347; }
    .btn-primary { background-color: #0076ce; color: #fff; }
    .btn-primary:hover { background-color: #005fa3; }
    .btn-danger { background-color: #fff; color: #b02a37; border-color: #e3a0a7; }
    .btn-danger:hover { background-color: #fdf2f3; }
    .search-box {

    }

        border-radius: 4px;
        padding: 6px 10px;
        font-size: 12px;

    .enum-hint {

        display: inline-block;

<body>

<div class="container">
    <div class="header-row">
        <h2>BIOS / iDRAC System Setup 參數檢視器</h2>
        <span class="badge-hint">解析範圍：<b>System Setup → System BIOS → System Information</b> 起</span>
    </div>

    <div class="upload-area" id="dropZone">
        <span class="upload-btn">選擇檔案</span>
        <span>點擊或拖曳 System Setup (.txt) 檔案至此處</span>
        <input type="file" id="fileInput" accept=".txt,.log,.text">
    </div>

    <div class="paste-panel">
        <div class="paste-head">
            <label for="pasteInput">或直接貼上 System Setup 內容（Ctrl + Enter 解析）</label>
            <div class="toolbar-actions">
                <button type="button" class="action-btn btn-primary" id="parseBtn">解析貼上內容</button>
                <button type="button" class="action-btn btn-danger" id="clearPasteBtn">清空輸入</button>
            </div>
        </div>
        <textarea id="pasteInput" placeholder="請將 System Setup 內容貼在此處……"></textarea>
    </div>

    <div class="info-bar" id="infoBar" style="display: none;">
        <div class="file-meta">
            <div class="file-name-display">來源：<span id="fileName"></span></div>
            <span class="format-tag" id="formatType"></span>
            <span id="rowCount" style="color: #495057;"></span>
        </div>
        <div class="toolbar-actions">
            <button type="button" class="action-btn btn-md" id="copyMdBtn">📋 複製 Markdown</button>
            <button type="button" class="action-btn btn-excel" id="exportExcelBtn">📊 下載 Excel</button>
            <input type="text" id="searchInput" class="search-box" placeholder="即時過濾參數或數值...">
        </div>
    </div>

    <div id="noticeContainer"></div>

    <div id="tableContainer">
        <div class="placeholder-text">請上傳或貼上 System Setup 文字以檢視內容</div>
    </div>
</div>

/* 分類標題 */

    "System Setup", "System BIOS", "System Information", "Memory Settings",

const DYN_SECTION_RE = /^(?:DIMM Slot|PXE Device|HTTP Device|iSCSI Device|NVMe-oF Subsystem|Connection)\s*\d+\s+Settings$/;
const DYN_PARAM_RE   = /^((?:DIMM Slot|PXE Device|HTTP Device|iSCSI Device|NVMe-oF Subsystem|Connection|Slot)\s*\d+)(.+)$/;
const ALERT_RE       = /^((?:Enable Alert Destination|Alert Destination)\s*[1-8])(\d+\.\d+\.\d+\.\d+|.*)$/;

/* =========================================================
   初始化枚舉 Map
   ========================================================= */
const paramEnumMap = new Map();
Object.entries(PRELOADED_ENUMS).forEach(([param, values]) => {
    paramEnumMap.set(param, new Set(values));
});

/* =========================================================
   事件綁定

/* =========================================================
   檔案處理（先嚐試 UTF-8，若含亂碼用 Latin-1 重讀）
   ========================================================= */
function handleFile(file) {
    const readerUtf8 = new FileReader();
    readerUtf8.onload = function (e) {
        let text = e.target.result;
        // 若 UTF-8 解碼後仍含常見亂碼特徵，改用 Latin-1 再試一次
        if (/[\uFFFD]/.test(text) && /[‚ÄĘÔāß]/.test(text) === false) {
            // 這裡不強制替換，讓解析層的容錯邏輯處理
        }
        currentBaseFileName = file.name.replace(/\.[^/.]+$/, '') || 'System_Setup';
        fileNameSpan.textContent = file.name;
        doParse(text);
    };
    readerUtf8.readAsText(file, 'UTF-8');
}

/* =========================================================
   主解析流程
   ========================================================= */
function doParse(text) {
    noticeContainer.innerHTML = '';
    searchInput.value = '';

    const rows = parseSystemSetup(text);

    if (!rows) {
        infoBar.style.display = 'none';
        tableContainer.innerHTML = '<div class="placeholder-text">未找到解析內容</div>';
        showNotice('找不到起始段落「System BIOS」。請確認內容包含 BIOS 選單區段。', true);
        return;
    }
    if (rows.length === 0) {
        infoBar.style.display = 'none';
        tableContainer.innerHTML = '<div class="placeholder-text">無可顯示的參數</div>';
        showNotice('已找到起始段落，但沒有解析到任何參數。', true);
        return;
    }

    rows.forEach(r => {
        if (r.type === 'data') learnEnum(r.param, r.value);
    });

    currentRows = rows;

    infoBar.style.display = 'flex';
    formatTypeSpan.textContent = 'System Setup 區段';
    const dataCount = rows.filter(r => r.type === 'data').length;
    rowCountSpan.textContent =
        `本次解析 ${dataCount} 項參數 ／ 累積已知 ${paramEnumMap.size} 個參數、${countEnumEntries()} 個候選值`;

    renderRows(currentRows);
}

function countEnumEntries() {
    let n = 0;
    paramEnumMap.forEach(s => { n += s.size; });
    return n;
}

/* =========================================================
   ★ 預處理單行：剝離項目符號前綴（含亂碼）
   ========================================================= */
function isBulletPrefix(p) {
    if (p === '' || p === 'o') return true;
    // 不含任何英文字母、數字、中文 → 視為項目符號（包含亂碼）
    return !/[A-Za-z0-9\u4e00-\u9fff]/.test(p);
}

function preprocessLine(rawLine) {
    let line = rawLine.replace(/\r/g, '');
    if (!line.trim()) return { content: '' };

    let content = line;

    // 有 tab：取第一個 tab 後的內容（若前綴是項目符號）
    if (content.includes('\t')) {
        const tabIdx = content.indexOf('\t');
        const prefix = content.slice(0, tabIdx).trim();
        const rest = content.slice(tabIdx + 1).trim();

        if (rest && isBulletPrefix(prefix)) {
            content = rest;
        }
    } else if (/^[^\sA-Za-z0-9\u4e00-\u9fff]/.test(content)) {
        // 無 tab，但以項目符號開頭（例如「• System BIOS」單空格分隔）
        const m = content.match(/^([^\sA-Za-z0-9\u4e00-\u9fff]+)\s+(.+)$/);
        if (m && m[2]) {
            content = m[2];
        }
    }

    return { content: content.trim() };
}

/* =========================================================
   解析：定位 System BIOS，往前回看 System Setup
   ========================================================= */
function parseSystemSetup(text) {
    const lines = text.split(/\r?\n/);

    // 找 System BIOS 行（去除項目符號後精確等於 "System BIOS"）
    let biosIdx = -1;
    for (let i = 0; i < lines.length; i++) {
        const { content } = preprocessLine(lines[i]);
        if (content === 'System BIOS') {
            biosIdx = i;
            break;
        }
    }
    if (biosIdx === -1) return null;

    // 往前回看 System Setup（允許中間只有空行）
    let startIdx = biosIdx;
    for (let j = biosIdx - 1; j >= 0; j--) {
        const { content } = preprocessLine(lines[j]);
        if (content === 'System Setup') {
            startIdx = j;
            break;
        }
        if (content !== '') break;
    }

    const out = [];
    for (let i = startIdx; i < lines.length; i++) {
        const { content } = preprocessLine(lines[i]);
        if (!content) continue;

        if (/^iDRAC\s+v[\d.]/i.test(content)) break;
        if (/^©/.test(content)) break;

        const parsed = parseSingleLine(content);
        if (!parsed) continue;

        // 略過「空值預告行」：下一行是同名參數的有值行
        if (parsed.type === 'data' && parsed.value === '') {
            let k = i + 1;
            while (k < lines.length && preprocessLine(lines[k]).content === '') k++;
            if (k < lines.length) {
                const nextContent = preprocessLine(lines[k]).content;
                if (nextContent.startsWith(parsed.param) && nextContent.length > parsed.param.length) {
                    const rest = nextContent.slice(parsed.param.length).trim();
                    if (rest && /^[A-Za-z0-9(]/.test(rest)) continue;
                }
            }
        }

        out.push(parsed);
    }
    return out;
}

/* =========================================================
   單行解析
   ========================================================= */
function parseSingleLine(line) {
    if (SECTION_TITLES.has(line)) {
        return { type: 'section', text: line, level: sectionLevel(line) };
    }
    if (DYN_SECTION_RE.test(line)) {
        return { type: 'section', text: line, level: 3 };
    }

    let m = line.match(DYN_PARAM_RE);
    if (m && m[2].trim() !== '') {
        return { type: 'data', param: m[1].trim(), value: m[2].trim() };
    }

    const hit = matchKnownParam(line);
    if (hit !== null) {
        return { type: 'data', param: hit, value: line.slice(hit.length).trim() };
    }

    m = line.match(ALERT_RE);
    if (m) {
        return { type: 'data', param: m[1].trim(), value: m[2].trim() };
    }

    const fallbackPatterns = [
        /^(.*?)(\(Not captured\))$/,
        /^(.*?)(Enabled|Disabled|On|Off|Auto|None|Full|Half|Standard|Linear|Normal|Balance|Public|public)$/,
        /^(.*?)(\d+(?:\.\d+)*(?:\s*(?:GB|MB|KB|TB|MT\/s|GHz|MHz|Mbps|W))?)$/,
        /^(.*?)(0x[0-9a-fA-F]+)$/
    ];
    for (const re of fallbackPatterns) {
        const fm = line.match(re);
        if (fm && fm[1].trim().length > 0) {
            return { type: 'data', param: fm[1].trim(), value: fm[2].trim() };
        }
    }

    return { type: 'section', text: line, level: 3 };
}

function matchKnownParam(line) {
    for (let i = 0; i < SORTED_PARAMS.length; i++) {
        const p = SORTED_PARAMS[i];
        if (line.startsWith(p)) {
            const rest = line.slice(p.length);
            if (rest && /^[a-z]/.test(rest) && /[A-Za-z]$/.test(p)) continue;
            return p;
        }
    }
    return null;
}

function sectionLevel(text) {
    if (text === 'System Setup') return 1;
    if (text === 'System BIOS' || text === 'iDRAC Settings') return 2;
    return 3;
}

/* =========================================================
   枚舉值學習
   ========================================================= */
function learnEnum(param, value) {
    if (!param || !value) return;
    if (value === '(Not captured)') return;
    if (!looksLikeEnum(value)) return;

    let set = paramEnumMap.get(param);
    if (!set) {
        set = new Set();
        paramEnumMap.set(param, set);
    }
    set.add(value);
}

function looksLikeEnum(v) {
    if (!v) return false;
    if (v.length > 64) return false;

    if (/^nqn\./i.test(v)) return false;
    if (/^[0-9a-f]{2}(:[0-9a-f]{2}){5}$/i.test(v)) return false;
    if (/^fe80:/i.test(v)) return false;
    if (/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(v)) return false;
    if (/^::/.test(v) || /::$/.test(v)) return false;

    return true;
}

/* =========================================================
   渲染
   ========================================================= */
function renderRows(rows) {
    let html = `
        <table id="dataTable">
            <thead>
                <tr>
                    <th style="width: 50%;">參數名稱 (Parameter) <span style="font-weight:400;opacity:.8;">［候選值］</span></th>
                    <th style="width: 50%;">數值 (Value)</th>
                </tr>
            </thead>
            <tbody>
    `;

    rows.forEach(row => {
        if (row.type === 'section') {
            const lvl = Math.min(Math.max(row.level || 3, 1), 3);
            html += `
                <tr class="section-header sec-lvl-${lvl}">
                    <td colspan="2">${escapeHtml(row.text)}</td>
                </tr>
            `;
            return;
        }

        const labelHtml = buildParamLabel(row.param);
        const hasValue = row.value && row.value !== '(Not captured)' && row.value.trim() !== '';
        const valHtml = hasValue
            ? escapeHtml(row.value)
            : '<span class="unknown-value">?</span>';

        html += `
            <tr class="data-row">
                <td class="param-cell">${labelHtml}</td>
                <td class="val-cell">${valHtml}</td>
            </tr>
        `;
    });

    html += `</tbody></table>`;
    tableContainer.innerHTML = html;
}

function buildParamLabel(param) {
    let html = escapeHtml(param);
    const set = paramEnumMap.get(param);
    if (set && set.size > 0) {
        const values = Array.from(set).sort((a, b) => a.localeCompare(b));
        html += ` <span class="enum-hint">[${escapeHtml(values.join(', '))}]</span>`;
    }
    return html;
}

/* =========================================================
   骨架表格（未解析前）
   ========================================================= */
function renderSkeleton() {
    if (currentRows.length > 0) return;

    let html = `
        <table id="dataTable">
            <thead>
                <tr>
                    <th style="width: 50%;">參數名稱 (Parameter) <span style="font-weight:400;opacity:.8;">［候選值］</span></th>
                    <th style="width: 50%;">數值 (Value)</th>
                </tr>
            </thead>
            <tbody>
    `;

    KNOWN_PARAM_SET.forEach(p => {
        html += `
            <tr class="data-row">
                <td class="param-cell">${buildParamLabel(p)}</td>
                <td class="val-cell"><span class="unknown-value">?</span></td>
            </tr>
        `;
    });

    html += `</tbody></table>`;
    tableContainer.innerHTML = html;

    showNotice('尚未載入任何 Log — 下方為已知參數骨架，數值皆顯示為「?」。左側［］內為已累積的候選值。');
}

function showNotice(msg, isError) {
    noticeContainer.innerHTML = `<div class="notice-bar${isError ? ' error' : ''}">${escapeHtml(msg)}</div>`;
}

/* =========================================================
   即時搜尋
   ========================================================= */
searchInput.addEventListener('input', function () {
    const filter = this.value.trim().toLowerCase();
    const rows = document.querySelectorAll('#dataTable tbody tr');

    rows.forEach(row => {
        if (row.classList.contains('section-header')) {
            row.style.display = filter === '' ? '' : 'none';
            return;
        }
        const text = row.textContent.toLowerCase();
        row.style.display = text.includes(filter) ? '' : 'none';
    });
});

function getFilteredRows() {
    const filter = searchInput.value.trim().toLowerCase();
    if (!filter) return currentRows;

    return currentRows.filter(row => {
        if (row.type === 'section') return false;
        const p = (row.param || '').toLowerCase();
        const v = (row.value || '').toLowerCase();
        return p.includes(filter) || v.includes(filter);
    });
}

/* =========================================================
   複製 Markdown
   ========================================================= */
copyMdBtn.addEventListener('click', async () => {
    const rows = getFilteredRows();
    if (rows.length === 0) {
        alert('目前沒有可複製的資料！');
        return;
    }

    const escapeMdCell = s => String(s == null ? '' : s).replace(/\|/g, '\\|').replace(/\r?\n/g, ' ');

    let mdLines = [`# ${currentBaseFileName}\n`];
    let inTable = false;

    rows.forEach(row => {
        if (row.type === 'section') {
            if (inTable) { mdLines.push(''); inTable = false; }
            const hashes = '#'.repeat(Math.min(Math.max((row.level || 3) + 1, 2), 4));
            mdLines.push(`${hashes} ${row.text}\n`);
        } else {
            if (!inTable) {
                mdLines.push('| 參數名稱 (Parameter) | 數值 (Value) |');
                mdLines.push('| :--- | :--- |');
                inTable = true;
            }
            const hasValue = row.value && row.value !== '(Not captured)';
            const displayVal = hasValue ? escapeMdCell(row.value) : '?';
            mdLines.push(`| ${escapeMdCell(row.param)} | ${displayVal} |`);
        }
    });

    const markdownText = mdLines.join('\n').trim() + '\n';

    try {
        await navigator.clipboard.writeText(markdownText);
    } catch (err) {
        const ta = document.createElement('textarea');
        ta.value = markdownText;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
    }

    const original = copyMdBtn.innerHTML;
    copyMdBtn.innerHTML = '✅ 已複製 Markdown！';
    copyMdBtn.classList.add('copied');
    setTimeout(() => {
        copyMdBtn.innerHTML = original;
        copyMdBtn.classList.remove('copied');
    }, 2000);
});

/* =========================================================
   匯出 Excel
   ========================================================= */
document.getElementById('exportExcelBtn').addEventListener('click', () => {
    const rows = getFilteredRows();
    if (rows.length === 0) {
        alert('目前沒有可匯出的資料！');
        return;
    }
    if (typeof XLSX === 'undefined') {
        alert('Excel 匯出元件尚未載入完成，請確認網路連線或稍後再試。');
        return;
    }

    const aoa = [['參數名稱 (Parameter)', '候選值 (Enum)', '數值 (Value)']];

    rows.forEach(row => {
        if (row.type === 'section') {
            const indent = (row.level || 3) === 1 ? '■ ' : ((row.level || 3) === 2 ? '  ▶ ' : '    • ');
            aoa.push([`${indent}${row.text}`, '', '']);
        } else {
            const set = paramEnumMap.get(row.param);
            const enumStr = set ? Array.from(set).sort((a, b) => a.localeCompare(b)).join(', ') : '';
            const hasValue = row.value && row.value !== '(Not captured)';
            aoa.push([row.param, enumStr, hasValue ? row.value : '?']);
        }
    });

    const wb = XLSX.utils.book_new();
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    ws['!cols'] = [{ wch: 52 }, { wch: 44 }, { wch: 44 }];
    XLSX.utils.book_append_sheet(wb, ws, 'System Setup');

    const suffix = searchInput.value.trim() ? '_filtered' : '';
    XLSX.writeFile(wb, `${currentBaseFileName}${suffix}.xlsx`);
});

/* =========================================================
   工具
   ========================================================= */
function escapeHtml(str) {
    return String(str == null ? '' : str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
}

/* =========================================================
   初始化
   ========================================================= */
renderSkeleton();
</script>
