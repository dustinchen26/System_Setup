<html lang="zh-Hant">

        align-items: center;

        margin-bottom: 10px;
        flex-wrap: wrap;
        gap: 6px;
    }
    h2 { margin: 0; font-size: 16px; color: #0076ce; }
    .badge-hint { font-size: 11px; color: #6c757d; }

    .upload-area {

        border-radius: 4px;
        padding: 10px 15px;
        text-align: center;
        background-color: #f8fbff;
        cursor: pointer;
        transition: background-color 0.15s;
        margin-bottom: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        flex-wrap: wrap;
    }
    .upload-area:hover, .upload-area.dragover { background-color: #e6f2ff; }
    .upload-area input[type="file"] { display: none; }
    .upload-btn {
        background-color: #0076ce;
        color: white;
        padding: 4px 12px;
        border-radius: 3px;
        font-size: 12px;
        font-weight: 500;
    }

    .paste-panel {
        border: 1px solid #ced4da;
        border-radius: 4px;
        padding: 8px 10px;
        background: #fcfcfd;
        margin-bottom: 10px;
    }
    .paste-panel .paste-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 6px;
        flex-wrap: wrap;
        gap: 6px;
    }
    .paste-panel label { font-size: 12px; font-weight: 600; color: #495057; }
    #pasteInput {
        width: 100%;
        min-height: 110px;
        resize: vertical;
        border: 1px solid #ced4da;
        border-radius: 3px;
        padding: 6px 8px;
        font-family: Consolas, "Courier New", monospace;
        font-size: 12px;
        line-height: 1.35;
        color: #212529;
        background: #fff;
    }
    #pasteInput:focus { outline: 2px solid #a8d1f5; border-color: #0076ce; }

    .info-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
        background-color: #e9ecef;
        padding: 6px 12px;
        border-radius: 4px;
        margin-bottom: 8px;
        font-size: 12px;
    }
    .file-meta { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .file-name-display { font-weight: bold; color: #212529; }
    .file-name-display span { color: #0076ce; }
    .format-tag {
        background: #0076ce; color: #fff; padding: 1px 6px; border-radius: 3px; font-size: 11px;
    }
    .toolbar-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .action-btn {
        padding: 4px 10px;
        border: 1px solid transparent;
        border-radius: 3px;
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 4px;
        transition: background-color 0.15s, border-color 0.15s;
    }
    .btn-md { background-color: #ffffff; color: #212529; border-color: #ced4da; }
    .btn-md:hover { background-color: #f8f9fa; border-color: #adb5bd; }
    .btn-md.copied { background-color: #198754; color: #ffffff; border-color: #198754; }
    .btn-excel { background-color: #198754; color: #ffffff; }
    .btn-excel:hover { background-color: #157347; }
    .btn-primary { background-color: #0076ce; color: #fff; }
    .btn-primary:hover { background-color: #005fa3; }
    .btn-danger { background-color: #fff; color: #b02a37; border-color: #e3a0a7; }
    .btn-danger:hover { background-color: #fdf2f3; }
    .search-box {
        padding: 4px 8px; border: 1px solid #ced4da; border-radius: 3px;
        width: 220px; font-size: 12px;
    }

        background: #fff8e1;
        border: 1px solid #ffe08a;
        color: #7a5c00;
        border-radius: 4px;
        padding: 6px 10px;
        font-size: 12px;
        margin-bottom: 8px;

        font-size: 12px;
        line-height: 1.25;
        table-layout: fixed;
    }

        border: 1px solid #dee2e6;
        padding: 3px 8px;
        text-align: left;
        word-break: break-word;
        vertical-align: middle;
    }

        z-index: 2;

    tr.data-row:hover { background-color: #e8f3fc; }

    .enum-hint {
        color: #8a6d00;
        background: #fff6d9;
        border: 1px solid #f0e0a8;
        border-radius: 3px;
        padding: 0 4px;
        font-size: 11px;
        font-family: Consolas, "Courier New", monospace;
        font-weight: 400;
        margin-left: 4px;
        display: inline-block;
        vertical-align: baseline;
    }

        font-family: Consolas, "Courier New", monospace;
        color: #0b5ed7;
    }

        color: #b02a37;
        font-weight: 700;
        font-family: Consolas, "Courier New", monospace;

        border-radius: 3px;
        padding: 0 6px;
        display: inline-block;

<body>

<div class="container">
    <div class="header-row">
        <h2>BIOS / iDRAC System Setup 參數檢視器</h2>
        <span class="badge-hint">解析範圍：<b>System Setup → System BIOS → System Information</b> 起</span>
    </div>

    <!-- 檔案上傳 -->
    <div class="upload-area" id="dropZone">
        <span class="upload-btn">選擇檔案</span>
        <span>點擊或拖曳 System Setup (.txt) 檔案至此處</span>
        <input type="file" id="fileInput" accept=".txt,.log,.text">
    </div>

    <!-- 貼上輸入 -->
    <div class="paste-panel">
        <div class="paste-head">
            <label for="pasteInput">或直接貼上 System Setup 內容（Ctrl + Enter 解析）</label>
            <div class="toolbar-actions">
                <button type="button" class="action-btn btn-primary" id="parseBtn">解析貼上內容</button>
                <button type="button" class="action-btn btn-danger" id="clearPasteBtn">清空輸入</button>
            </div>
        </div>
        <textarea id="pasteInput" placeholder="請將 System Setup 內容貼在此處……"></textarea>
    </div>

    <!-- 資訊列 -->
    <div class="info-bar" id="infoBar" style="display: none;">
        <div class="file-meta">
            <div class="file-name-display">來源：<span id="fileName"></span></div>
            <span class="format-tag" id="formatType"></span>
            <span id="rowCount" style="color: #495057;"></span>
        </div>
        <div class="toolbar-actions">
            <button type="button" class="action-btn btn-md" id="copyMdBtn">📋 複製 Markdown</button>
            <button type="button" class="action-btn btn-excel" id="exportExcelBtn">📊 下載 Excel</button>
            <input type="text" id="searchInput" class="search-box" placeholder="即時過濾參數或數值...">
        </div>
    </div>

    <div id="noticeContainer"></div>

    <!-- 資料表格 -->
    <div id="tableContainer">
        <div class="placeholder-text">請上傳或貼上 System Setup 文字以檢視內容</div>
    </div>
</div>

    "System Time", "System Date", "Time Zone", "Daylight Saving Time", "Asset Tag",
    "Keyboard NumLock", "F1/F2 Prompt on Error", "Dell Wyse P25/P45 BIOS Access",
    "Power Cycle Request", "ACPI FPDT",

    // iDRAC Network
    "Enable NIC", "NIC Selection", "Failover Network", "MAC Address", "Link Tuning",
    "Auto Dedicated NIC", "Network Speed (Mbps)", "Active NIC Interface", "Duplex Mode",

    // IPv4
    "Enable IPv4", "Enable DHCP", "Static IP Address", "Static Gateway",
    "Static Subnet Mask", "Use DHCP to Obtain DNS Server Addresses",
    "Static Preferred DNS Server", "Static Alternate DNS Server",

    // IPv6
    "Enable IPv6", "Address Generation Mode", "Enable Auto-Configuration",
    "Static IP Address 1", "Static Prefix Length", "Link Local Address",
    "IP Address 2", "Use DHCPv6 to Obtain DNS Server Addresses",

    // VLAN / Common
    "Enable VLAN ID", "Priority",
    "Register iDRAC on DNS", "DNS iDRAC Name", "Auto-Configure Domain Name",
    "Static DNS Domain Name",

    // IPMI / Alerts
    "Enable IPMI over LAN", "Channel Privilege Level Limit", "Encryption Key",
    "Enable Platform Event Filter Alerts",
    "Enable Alert Destination 1", "Enable Alert Destination 2",
    "Enable Alert Destination 3", "Enable Alert Destination 4",
    "Enable Alert Destination 5", "Enable Alert Destination 6",
    "Enable Alert Destination 7", "Enable Alert Destination 8",
    "Community String",

    // Media & USB
    "Virtual Media Status", "USB Management Port Mode",
    "USB Server Configuration Profile (SCP)",

    // Lifecycle Controller
    "Lifecycle Controller", "Collect System Inventory on Restart",
    "Configuration Validation State",

    // Power
    "Power Cap Policy", "Maximum Power Cap (W)", "Minimum Power Cap (W)",
    "Power Cap (W)", "Power Supply Capacity Alert",
    "Redundancy Policy", "Hot Spare",

    // Thermal
    "Thermal Profile", "Fan Speed Offset", "Minimum Fan Speed",

    // System Location
    "Data Center Name", "Aisle Name", "Rack Name", "Rack Slot",
    "Size of Managed System (U)",

    // User Configuration
    "User ID", "Enable User", "User Name", "LAN User Privilege",
    "Serial Port User Privilege", "Password",

    // OS to iDRAC Pass-Through / Remote Enablement
    "LOM Pass-Through Configuration", "USB Pass-Through Configuration",
    "USB NIC IP Address", "Enable Auto-Discovery", "Provisioning Server"
];

/* 去重並依長度排序（長者優先，確保前綴匹配正確） */
const KNOWN_PARAM_SET = Array.from(new Set(KNOWN_PARAMS));
const SORTED_PARAMS   = [...KNOWN_PARAM_SET].sort((a, b) => b.length - a.length);

/* 分類標題（精確比對） */
const SECTION_TITLES = new Set([
    "System Setup", "System BIOS", "System Information", "Memory Settings",
    "Memory Map Out", "Processor Settings", "Processor 0", "Processor 1",
    "NVMe Settings", "Boot Settings", "UEFI Boot Settings", "Network Settings",
    "TLS Authentication", "Integrated Devices", "Slot Disablement",
    "Slot Bifurcation", "Serial Communication", "System Profile Settings",
    "System Security", "TPM Advanced Settings", "Redundant OS Control",
    "Miscellaneous Settings", "iDRAC Settings", "System Summary",
    "System Event Log", "Network", "NIC 1", "IPv4", "IPv6", "VLAN",
    "Common Settings", "IPMI", "Alerts", "Front Panel Security",
    "Media & USB Settings", "Virtual Media", "USB Management Port",
    "Lifecycle Controller", "Hardware Configuration Validation",
    "Power Configuration", "Power Supply Options", "Thermal",
    "System Location", "User Configuration", "Communications Permissions",
    "OS to iDRAC Pass-Through", "Remote Enablement", "About",
    "NVMe-oF Subsystem Settings"
]);

/* 動態編號型標題（PXE Device 1 Settings、NVMe-oF Subsystem 1 Settings...） */
const DYN_SECTION_RE = /^(?:DIMM Slot|PXE Device|HTTP Device|iSCSI Device|NVMe-oF Subsystem|Connection)\s*\d+\s+Settings$/;

/* 動態編號型參數（DIMM Slot 0Enabled、PXE Device 1Enabled、Slot 21Enabled...） */
const DYN_PARAM_RE = /^((?:DIMM Slot|PXE Device|HTTP Device|iSCSI Device|NVMe-oF Subsystem|Connection|Slot)\s*\d+)(.+)$/;

/* Alert Destination 動態編號 */
const ALERT_RE = /^((?:Enable Alert Destination|Alert Destination)\s*[1-8])(\d+\.\d+\.\d+\.\d+|.*)$/;

/* =========================================================
   初始化枚舉 Map（先載入預置值，之後解析會持續累積）
   ========================================================= */
const paramEnumMap = new Map();
Object.entries(PRELOADED_ENUMS).forEach(([param, values]) => {
    paramEnumMap.set(param, new Set(values));
});

/* =========================================================
   事件綁定
   ========================================================= */
fileInput.addEventListener('change', e => {
    if (e.target.files.length > 0) handleFile(e.target.files[0]);
});

dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', e => {
    e.preventDefault();
    dropZone.classList.add('dragover');
});
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('dragover');
    if (e.dataTransfer.files.length > 0) handleFile(e.dataTransfer.files[0]);
});

parseBtn.addEventListener('click', () => {
    const txt = pasteInput.value;
    if (!txt.trim()) {
        showNotice('請先貼上 System Setup 內容。', true);
        return;
    }
    currentBaseFileName = 'Pasted_System_Setup';
    fileNameSpan.textContent = '（貼上內容）';
    doParse(txt, '貼上內容');
});

pasteInput.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        e.preventDefault();
        parseBtn.click();
    }
});

clearPasteBtn.addEventListener('click', () => {
    pasteInput.value = '';
    pasteInput.focus();
});

/* =========================================================
   檔案處理
   ========================================================= */
function handleFile(file) {
    const reader = new FileReader();
    reader.onload = function (e) {
        currentBaseFileName = file.name.replace(/\.[^/.]+$/, '') || 'System_Setup';
        fileNameSpan.textContent = file.name;
        doParse(e.target.result, file.name);
    };
    reader.readAsText(file, 'UTF-8');
}

/* =========================================================
   主解析流程
   ========================================================= */
function doParse(text) {
    noticeContainer.innerHTML = '';
    searchInput.value = '';

    const rows = parseSystemSetup(text);

    if (!rows) {
        infoBar.style.display = 'none';
        tableContainer.innerHTML = '<div class="placeholder-text">未找到解析內容</div>';
        showNotice('找不到起始段落「System Setup → System BIOS」。請確認內容包含 BIOS 選單區段。', true);
        return;
    }
    if (rows.length === 0) {
        infoBar.style.display = 'none';
        tableContainer.innerHTML = '<div class="placeholder-text">無可顯示的參數</div>';
        showNotice('已找到起始段落，但沒有解析到任何參數。', true);
        return;
    }

    // 學習本次 Log 中的枚舉值（累積到 paramEnumMap）
    rows.forEach(r => {
        if (r.type === 'data') learnEnum(r.param, r.value);
    });

    currentRows = rows;

    infoBar.style.display = 'flex';
    formatTypeSpan.textContent = 'System Setup 區段';
    const dataCount = rows.filter(r => r.type === 'data').length;
    rowCountSpan.textContent =
        `本次解析 ${dataCount} 項參數 ／ 累積已知 ${paramEnumMap.size} 個參數、${countEnumEntries()} 個候選值`;

    renderRows(currentRows);
}

/* 統計目前累積的候選值總數 */
function countEnumEntries() {
    let n = 0;
    paramEnumMap.forEach(s => { n += s.size; });
    return n;
}

/* =========================================================
   解析：只從 System Setup → System BIOS 之後開始
   ========================================================= */
function parseSystemSetup(text) {
    const lines = text.split(/\r?\n/);

    // 尋找起點：System Setup 後緊接 System BIOS
    let startIdx = -1;
    for (let i = 0; i < lines.length; i++) {
        if (lines[i].trim() !== 'System Setup') continue;
        let j = i + 1;
        while (j < lines.length && lines[j].trim() === '') j++;
        if (j < lines.length && lines[j].trim() === 'System BIOS') {
            startIdx = i;
            break;
        }
    }
    if (startIdx === -1) return null;

    const out = [];
    for (let i = startIdx; i < lines.length; i++) {
        const line = lines[i].replace(/\r/g, '').trim();
        if (!line) continue;

        // 結束標記（頁尾）
        if (/^iDRAC\s+v[\d.]/i.test(line)) break;
        if (/^©/.test(line)) break;

        const parsed = parseSingleLine(line);
        if (!parsed) continue;

        // 略過空值「預告行」：下一行是同名參數的有值行
        if (parsed.type === 'data' && parsed.value === '') {
            let k = i + 1;
            while (k < lines.length && lines[k].trim() === '') k++;
            if (k < lines.length) {
                const next = lines[k].trim();
                if (next.startsWith(parsed.param) && next.length > parsed.param.length) {
                    const rest = next.slice(parsed.param.length).trim();
                    if (rest && /^[A-Za-z0-9(]/.test(rest)) continue;
                }
            }
        }

        out.push(parsed);
    }
    return out;
}

/* =========================================================
   單行解析
   ========================================================= */
function parseSingleLine(line) {
    /* 1. 精確分類標題 */
    if (SECTION_TITLES.has(line)) {
        return { type: 'section', text: line, level: sectionLevel(line) };
    }

    /* 2. 動態編號型標題 */
    if (DYN_SECTION_RE.test(line)) {
        return { type: 'section', text: line, level: 3 };
    }

    /* 3. 動態編號型參數 */
    let m = line.match(DYN_PARAM_RE);
    if (m && m[2].trim() !== '') {
        return { type: 'data', param: m[1].trim(), value: m[2].trim() };
    }

    /* 4. 已知參數最長前綴 */
    const hit = matchKnownParam(line);
    if (hit !== null) {
        return { type: 'data', param: hit, value: line.slice(hit.length).trim() };
    }

    /* 5. Alert Destination 動態編號 */
    m = line.match(ALERT_RE);
    if (m) {
        return { type: 'data', param: m[1].trim(), value: m[2].trim() };
    }

    /* 6. Fallback 規則 */
    const fallbackPatterns = [
        /^(.*?)(\(Not captured\))$/,
        /^(.*?)(Enabled|Disabled|On|Off|Auto|None|Full|Half|Standard|Linear|Normal|Balance|Public|public)$/,
        /^(.*?)(\d+(?:\.\d+)*(?:\s*(?:GB|MB|KB|TB|MT\/s|GHz|MHz|Mbps|W))?)$/,
        /^(.*?)(0x[0-9a-fA-F]+)$/
    ];
    for (const re of fallbackPatterns) {
        const fm = line.match(re);
        if (fm && fm[1].trim().length > 0) {
            return { type: 'data', param: fm[1].trim(), value: fm[2].trim() };
        }
    }

    /* 7. 其餘視為分類標題 */
    return { type: 'section', text: line, level: 3 };
}

/* 最長前綴比對 */
function matchKnownParam(line) {
    for (let i = 0; i < SORTED_PARAMS.length; i++) {
        const p = SORTED_PARAMS[i];
        if (line.startsWith(p)) {
            const rest = line.slice(p.length);
            // 避免 "VLAN" 吃掉 "VLANXxx" 之類誤切
            if (rest && /^[a-z]/.test(rest) && /[A-Za-z]$/.test(p)) continue;
            return p;
        }
    }
    return null;
}

/* 分類標題層級 */
function sectionLevel(text) {
    if (text === 'System Setup') return 1;
    if (text === 'System BIOS' || text === 'iDRAC Settings') return 2;
    return 3;
}

/* =========================================================
   枚舉值學習（累積，跨 Log）
   ========================================================= */
function learnEnum(param, value) {
    if (!param || !value) return;
    if (value === '(Not captured)') return;
    if (!looksLikeEnum(value)) return;

    let set = paramEnumMap.get(param);
    if (!set) {
        set = new Set();
        paramEnumMap.set(param, set);
    }
    set.add(value);
}

/* 判斷是否適合作為候選 enum */
function looksLikeEnum(v) {
    if (!v) return false;
    if (v.length > 64) return false;
    // 排除 IPv6 / MAC / NQN / 唯一識別碼等
    if (/::/.test(v)) return false;
    if (/^nqn\./i.test(v)) return false;
    if (/^[0-9a-f:.\-]+$/i.test(v) && v.length > 10) return false;
    // 必須以字母開頭，僅允許常見字元
    if (!/^[A-Za-z][A-Za-z0-9 ._()\/\-:]*$/.test(v)) return false;
    return true;
}

/* =========================================================
   渲染
   ========================================================= */
function renderRows(rows) {
    let html = `
        <table id="dataTable">
            <thead>
                <tr>
                    <th style="width: 50%;">參數名稱 (Parameter) <span style="font-weight:400;opacity:.8;">［候選值］</span></th>
                    <th style="width: 50%;">數值 (Value)</th>
                </tr>
            </thead>
            <tbody>
    `;

    rows.forEach(row => {
        if (row.type === 'section') {
            const lvl = Math.min(Math.max(row.level || 3, 1), 3);
            html += `
                <tr class="section-header sec-lvl-${lvl}">
                    <td colspan="2">${escapeHtml(row.text)}</td>
                </tr>
            `;
            return;
        }

        const labelHtml = buildParamLabel(row.param);
        const hasValue = row.value && row.value !== '(Not captured)' && row.value.trim() !== '';
        const valHtml = hasValue
            ? escapeHtml(row.value)
            : '<span class="unknown-value">?</span>';

        html += `
            <tr class="data-row">
                <td class="param-cell">${labelHtml}</td>
                <td class="val-cell">${valHtml}</td>
            </tr>
        `;
    });

    html += `</tbody></table>`;
    tableContainer.innerHTML = html;
}

/* 左側欄：參數名稱 + 已知候選值 */
function buildParamLabel(param) {
    let html = escapeHtml(param);
    const set = paramEnumMap.get(param);
    if (set && set.size > 0) {
        const values = Array.from(set).sort((a, b) => a.localeCompare(b));
        html += ` <span class="enum-hint">[${escapeHtml(values.join(', '))}]</span>`;
    }
    return html;
}

/* =========================================================
   「尚未 Parse 前」的骨架表格（右側全部為 ?）
   ========================================================= */
function renderSkeleton() {
    if (currentRows.length > 0) return;

    let html = `
        <table id="dataTable">
            <thead>
                <tr>
                    <th style="width: 50%;">參數名稱 (Parameter) <span style="font-weight:400;opacity:.8;">［候選值］</span></th>
                    <th style="width: 50%;">數值 (Value)</th>
                </tr>
            </thead>
            <tbody>
    `;

    KNOWN_PARAM_SET.forEach(p => {
        html += `
            <tr class="data-row">
                <td class="param-cell">${buildParamLabel(p)}</td>
                <td class="val-cell"><span class="unknown-value">?</span></td>
            </tr>
        `;
    });

    html += `</tbody></table>`;
    tableContainer.innerHTML = html;

    showNotice('尚未載入任何 Log — 下方為已知參數骨架，數值皆顯示為「?」。左側［］內為預置與累積的候選值。');
}

/* =========================================================
   提示列
   ========================================================= */
function showNotice(msg, isError) {
    noticeContainer.innerHTML = `<div class="notice-bar${isError ? ' error' : ''}">${escapeHtml(msg)}</div>`;
}

/* =========================================================
   即時搜尋
   ========================================================= */
searchInput.addEventListener('input', function () {
    const filter = this.value.trim().toLowerCase();
    const rows = document.querySelectorAll('#dataTable tbody tr');

    rows.forEach(row => {
        if (row.classList.contains('section-header')) {
            row.style.display = filter === '' ? '' : 'none';
            return;
        }
        const text = row.textContent.toLowerCase();
        row.style.display = text.includes(filter) ? '' : 'none';
    });
});

/* =========================================================
   取得目前（過濾後）資料列
   ========================================================= */
function getFilteredRows() {
    const filter = searchInput.value.trim().toLowerCase();
    if (!filter) return currentRows;

    return currentRows.filter(row => {
        if (row.type === 'section') return false;
        const p = (row.param || '').toLowerCase();
        const v = (row.value || '').toLowerCase();
        return p.includes(filter) || v.includes(filter);
    });
}

/* =========================================================
   複製 Markdown
   ========================================================= */
copyMdBtn.addEventListener('click', async () => {
    const rows = getFilteredRows();
    if (rows.length === 0) {
        alert('目前沒有可複製的資料！');
        return;
    }

    const escapeMdCell = s => String(s == null ? '' : s).replace(/\|/g, '\\|').replace(/\r?\n/g, ' ');

    let mdLines = [`# ${currentBaseFileName}\n`];
    let inTable = false;

    rows.forEach(row => {
        if (row.type === 'section') {
            if (inTable) { mdLines.push(''); inTable = false; }
            const hashes = '#'.repeat(Math.min(Math.max((row.level || 3) + 1, 2), 4));
            mdLines.push(`${hashes} ${row.text}\n`);
        } else {
            if (!inTable) {
                mdLines.push('| 參數名稱 (Parameter) | 數值 (Value) |');
                mdLines.push('| :--- | :--- |');
                inTable = true;
            }
            const hasValue = row.value && row.value !== '(Not captured)';
            const displayVal = hasValue ? escapeMdCell(row.value) : '?';
            mdLines.push(`| ${escapeMdCell(row.param)} | ${displayVal} |`);
        }
    });

    const markdownText = mdLines.join('\n').trim() + '\n';

    try {
        await navigator.clipboard.writeText(markdownText);
    } catch (err) {
        const ta = document.createElement('textarea');
        ta.value = markdownText;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
    }

    const original = copyMdBtn.innerHTML;
    copyMdBtn.innerHTML = '✅ 已複製 Markdown！';
    copyMdBtn.classList.add('copied');
    setTimeout(() => {
        copyMdBtn.innerHTML = original;
        copyMdBtn.classList.remove('copied');
    }, 2000);
});

/* =========================================================
   匯出 Excel（含候選值欄）
   ========================================================= */
document.getElementById('exportExcelBtn').addEventListener('click', () => {
    const rows = getFilteredRows();
    if (rows.length === 0) {
        alert('目前沒有可匯出的資料！');
        return;
    }
    if (typeof XLSX === 'undefined') {
        alert('Excel 匯出元件尚未載入完成，請確認網路連線或稍後再試。');
        return;
    }

    const aoa = [['參數名稱 (Parameter)', '候選值 (Enum)', '數值 (Value)']];

    rows.forEach(row => {
        if (row.type === 'section') {
            const indent = (row.level || 3) === 1 ? '■ ' : ((row.level || 3) === 2 ? '  ▶ ' : '    • ');
            aoa.push([`${indent}${row.text}`, '', '']);
        } else {
            const set = paramEnumMap.get(row.param);
            const enumStr = set ? Array.from(set).sort((a, b) => a.localeCompare(b)).join(', ') : '';
            const hasValue = row.value && row.value !== '(Not captured)';
            aoa.push([row.param, enumStr, hasValue ? row.value : '?']);
        }
    });

    const wb = XLSX.utils.book_new();
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    ws['!cols'] = [{ wch: 52 }, { wch: 44 }, { wch: 44 }];
    XLSX.utils.book_append_sheet(wb, ws, 'System Setup');

    const suffix = searchInput.value.trim() ? '_filtered' : '';
    XLSX.writeFile(wb, `${currentBaseFileName}${suffix}.xlsx`);
});

/* =========================================================
   工具
   ========================================================= */
function escapeHtml(str) {
    return String(str == null ? '' : str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
}

/* =========================================================
   初始化
   ========================================================= */
renderSkeleton();
</script>
